<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Organizer: Collaborative Sign-up & Chat</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc;
        }
        /* Mobile-first card styling */
        .app-card {
            background-color: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* Style for the chat area to make it scrollable */
        #chatDisplay {
            height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse; /* New messages at the bottom */
        }
        /* Custom scrollbar for aesthetics */
        #chatDisplay::-webkit-scrollbar { width: 4px; }
        #chatDisplay::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 2px; }
        .message-bubble {
            max-width: 80%;
            border-radius: 1rem;
            padding: 0.5rem 0.75rem;
            margin-bottom: 0.5rem;
            word-wrap: break-word;
        }
        .message-mine {
            background-color: #4f46e5;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }
        .message-other {
            background-color: #e5e7eb;
            color: #1f2937;
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }
    </style>
</head>
<body class="min-h-screen p-2 sm:p-4">

    <div id="loading" class="text-center text-xl text-indigo-600 font-semibold mt-10">Initializing Event App...</div>

    <div id="app" class="max-w-xl mx-auto hidden space-y-4">
        <header class="text-center py-4">
            <h1 class="text-3xl font-extrabold text-indigo-700">Event Organizer</h1>
            <p class="mt-1 text-xs text-gray-500">Share your User ID with friends to coordinate: <span id="userIdDisplay" class="font-mono bg-gray-100 p-0.5 rounded"></span></p>
        </header>

        <!-- EVENT DETAILS CARD (Organizer Section) -->
        <div id="eventDetailsCard" class="app-card shadow-indigo-200/50 border-t-4 border-indigo-500">
            <h2 class="text-xl font-bold text-indigo-600 mb-4">Event Details</h2>
            <div id="eventDisplay">
                <!-- Event data loaded here -->
                <p class="text-gray-500 italic">No event set yet. Be the organizer and set one below!</p>
            </div>
            
            <button id="showEventFormBtn" class="mt-4 w-full bg-indigo-500 text-white py-2 rounded-lg hover:bg-indigo-600 transition duration-150">
                Set/Edit Event (Organizer)
            </button>

            <!-- Event Setup Form (Hidden by default) -->
            <form id="eventSetupForm" class="mt-4 p-4 border border-indigo-200 rounded-lg hidden space-y-3">
                <input type="text" id="eventName" placeholder="Event Name (e.g., Birthday Party)"
                       class="w-full p-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500" required>
                
                <input type="datetime-local" id="eventDateTime"
                       class="w-full p-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500" required>

                <div class="flex space-x-2">
                    <select id="eventType" class="flex-grow p-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="Barbeque">Barbeque</option>
                        <option value="Birthday">Birthday</option>
                        <option value="Christmas">Christmas</option>
                        <option value="Easter">Easter</option>
                        <option value="Lads Day">Lads Day</option>
                        <option value="Woman's Day">Woman's Day</option>
                        <option value="Custom">Custom Type...</option>
                    </select>
                    <input type="text" id="customEventType" placeholder="Custom Type"
                           class="w-1/2 p-2 border rounded-md focus:ring-indigo-500 focus:border-indigo-500 hidden">
                </div>
                
                <button type="submit" class="w-full bg-green-500 text-white py-2 rounded-lg font-semibold hover:bg-green-600 transition">
                    Save Event Details
                </button>
            </form>
        </div>
        
        <!-- ATTENDEES CARD -->
        <div class="app-card shadow-green-200/50 border-t-4 border-green-500">
            <h2 class="text-xl font-bold text-green-600 mb-4">Who's Coming?</h2>
            
            <!-- Attendee Sign-up Form -->
            <form id="attendeeForm" class="space-y-3 mb-4 p-3 border border-green-200 rounded-lg">
                <p class="text-sm font-semibold text-gray-700">Join the event:</p>
                <input type="text" id="attendeeName" placeholder="Your Name"
                       class="w-full p-2 border rounded-md focus:ring-green-500 focus:border-green-500" required>
                <input type="text" id="bringItem" placeholder="What you will bring (e.g., Drinks, Salad, Cake)"
                       class="w-full p-2 border rounded-md focus:ring-green-500 focus:border-green-500" required>
                <button type="submit" class="w-full bg-green-500 text-white py-2 rounded-lg font-semibold hover:bg-green-600 transition">
                    Register / Update
                </button>
            </form>

            <!-- Attendee List Display -->
            <div id="attendeeList" class="divide-y divide-gray-100 max-h-64 overflow-y-auto">
                <p class="text-gray-400 italic text-center p-2">Waiting for registrations...</p>
            </div>
        </div>

        <!-- CHAT GROUP CARD -->
        <div class="app-card shadow-yellow-200/50 border-t-4 border-yellow-500">
            <h2 class="text-xl font-bold text-yellow-600 mb-4">Group Chat</h2>
            
            <div id="chatDisplay" class="bg-gray-50 p-3 rounded-lg border border-gray-200 mb-4">
                <!-- Chat messages load here -->
            </div>

            <form id="chatForm" class="flex gap-2">
                <input type="text" id="chatMessage" placeholder="Type your message..."
                       class="flex-grow p-2 border rounded-l-lg focus:ring-yellow-500 focus:border-yellow-500" required>
                
                <div class="relative">
                    <button type="button" id="emojiButton" class="p-2 bg-gray-200 text-xl rounded-md hover:bg-gray-300 transition">😀</button>
                    <div id="emojiPicker" class="absolute bottom-full right-0 mb-2 w-48 bg-white border border-gray-300 rounded-lg shadow-xl p-2 hidden z-10">
                        <!-- Emojis -->
                        <span class="emoji-select cursor-pointer p-1 hover:bg-gray-100 rounded text-xl">👍</span>
                        <span class="emoji-select cursor-pointer p-1 hover:bg-gray-100 rounded text-xl">🎉</span>
                        <span class="emoji-select cursor-pointer p-1 hover:bg-gray-100 rounded text-xl">😂</span>
                        <span class="emoji-select cursor-pointer p-1 hover:bg-gray-100 rounded text-xl">🥳</span>
                        <span class="emoji-select cursor-pointer p-1 hover:bg-gray-100 rounded text-xl">🍕</span>
                        <span class="emoji-select cursor-pointer p-1 hover:bg-gray-100 rounded text-xl">🍻</span>
                        <span class="emoji-select cursor-pointer p-1 hover:bg-gray-100 rounded text-xl">🎁</span>
                    </div>
                </div>

                <button type="submit"
                        class="bg-yellow-500 text-white font-semibold py-2 px-4 rounded-r-lg hover:bg-yellow-600 transition">
                    Send
                </button>
            </form>
        </div>

    </div>

    <script type="module">
        // Global variables provided by the Canvas environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- FIREBASE IMPORTS ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, doc, onSnapshot, collection, query, addDoc, setDoc, updateDoc, 
            serverTimestamp, orderBy, limit
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Initialization
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- DOM Elements ---
        const loadingDiv = document.getElementById('loading');
        const appDiv = document.getElementById('app');
        const userIdDisplay = document.getElementById('userIdDisplay');
        
        // Event Setup Elements
        const eventDetailsCard = document.getElementById('eventDetailsCard');
        const showEventFormBtn = document.getElementById('showEventFormBtn');
        const eventSetupForm = document.getElementById('eventSetupForm');
        const eventTypeSelect = document.getElementById('eventType');
        const customEventTypeInput = document.getElementById('customEventType');
        const eventDisplay = document.getElementById('eventDisplay');

        // Attendee Elements
        const attendeeForm = document.getElementById('attendeeForm');
        const attendeeList = document.getElementById('attendeeList');
        
        // Chat Elements
        const chatForm = document.getElementById('chatForm');
        const chatMessageInput = document.getElementById('chatMessage');
        const chatDisplay = document.getElementById('chatDisplay');
        const emojiButton = document.getElementById('emojiButton');
        const emojiPicker = document.getElementById('emojiPicker');

        let userId = null;
        let attendeeNameCache = "Guest User"; // Cache for chat name
        
        // --- FIREBASE PATHS (PUBLIC & COLLABORATIVE) ---
        const PUBLIC_DATA_PATH = `artifacts/${appId}/public/data`;
        const EVENT_DOC_PATH = doc(db, `${PUBLIC_DATA_PATH}/events`, 'current_event');
        const ATTENDEES_COLLECTION = collection(db, `${PUBLIC_DATA_PATH}/attendees`);
        const MESSAGES_COLLECTION = collection(db, `${PUBLIC_DATA_PATH}/messages`);


        // --- AUTHENTICATION & INITIALIZATION ---

        async function initializeAuth() {
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Authentication error:", error);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userId = user.uid;
                userIdDisplay.textContent = userId;
                appDiv.classList.remove('hidden');
                loadingDiv.classList.add('hidden');
                startDataListeners();
            } else {
                console.log("User signed out or not authenticated.");
                userIdDisplay.textContent = "N/A - Signing In...";
                if (window.eventUnsub) window.eventUnsub();
                if (window.attendeeUnsub) window.attendeeUnsub();
                if (window.messageUnsub) window.messageUnsub();
            }
        });

        // --- DATA LISTENERS ---
        function startDataListeners() {
            // 1. Listen to Event Details
            window.eventUnsub = onSnapshot(EVENT_DOC_PATH, (docSnapshot) => {
                const event = docSnapshot.data();
                renderEventDetails(event);
            }, (error) => {
                console.error("Error listening to event:", error);
            });

            // 2. Listen to Attendees
            const attendeesQuery = query(ATTENDEES_COLLECTION, orderBy('timestamp', 'asc'));
            window.attendeeUnsub = onSnapshot(attendeesQuery, (snapshot) => {
                const attendees = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderAttendees(attendees);
                
                // Cache the current user's name for chat messages
                const currentUserAttendee = attendees.find(a => a.userId === userId);
                if (currentUserAttendee) {
                    attendeeNameCache = currentUserAttendee.name;
                    document.getElementById('attendeeName').value = currentUserAttendee.name;
                    document.getElementById('bringItem').value = currentUserAttendee.item;
                }
            }, (error) => {
                console.error("Error listening to attendees:", error);
            });

            // 3. Listen to Chat Messages
            // Fetch last 50 messages, ordered by descending timestamp (newest first for the query)
            const chatQuery = query(MESSAGES_COLLECTION, orderBy('timestamp', 'desc'), limit(50)); 
            window.messageUnsub = onSnapshot(chatQuery, (snapshot) => {
                const messages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Reverse the array to display oldest first in the DOM
                messages.reverse(); 
                renderMessages(messages);
            }, (error) => {
                console.error("Error listening to messages:", error);
            });
        }


        // --- CRUD / ACTION HANDLERS ---

        // 1. Event Setup
        eventSetupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('eventName').value.trim();
            const dateTimeString = document.getElementById('eventDateTime').value;
            const type = eventTypeSelect.value === 'Custom' ? customEventTypeInput.value.trim() : eventTypeSelect.value;
            
            if (!name || !dateTimeString || !type) {
                console.error("All event fields must be filled.");
                return;
            }

            try {
                await setDoc(EVENT_DOC_PATH, {
                    name: name,
                    date: dateTimeString,
                    type: type,
                    organizerId: userId,
                    updatedAt: serverTimestamp()
                }, { merge: true });

                eventSetupForm.classList.add('hidden');
                showEventFormBtn.textContent = 'Edit Event Details';
            } catch (error) {
                console.error("Error setting event details:", error);
            }
        });

        // Toggle visibility of Custom Type Input
        eventTypeSelect.addEventListener('change', () => {
            if (eventTypeSelect.value === 'Custom') {
                customEventTypeInput.classList.remove('hidden');
                customEventTypeInput.required = true;
            } else {
                customEventTypeInput.classList.add('hidden');
                customEventTypeInput.required = false;
            }
        });

        // Toggle visibility of Event Setup Form
        showEventFormBtn.addEventListener('click', () => {
            eventSetupForm.classList.toggle('hidden');
        });

        // 2. Attendee Registration
        attendeeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('attendeeName').value.trim();
            const item = document.getElementById('bringItem').value.trim();

            if (!name || !item) {
                console.error("Attendee name and item must be filled.");
                return;
            }

            try {
                // Use the user's ID as the document ID for upsert (update or insert)
                const attendeeDocRef = doc(ATTENDEES_COLLECTION, userId);
                await setDoc(attendeeDocRef, {
                    name: name,
                    item: item,
                    userId: userId,
                    timestamp: serverTimestamp()
                });
                attendeeNameCache = name; // Update cache
            } catch (error) {
                console.error("Error registering attendee:", error);
            }
        });

        // 3. Chat Message Sending
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = chatMessageInput.value.trim();
            if (!messageText) return;

            try {
                await addDoc(MESSAGES_COLLECTION, {
                    senderId: userId,
                    senderName: attendeeNameCache, // Use the cached name
                    text: messageText,
                    timestamp: serverTimestamp()
                });
                chatMessageInput.value = ''; // Clear input
            } catch (error) {
                console.error("Error sending message:", error);
            }
        });
        
        // 4. Emoji Picker
        emojiButton.addEventListener('click', () => {
            emojiPicker.classList.toggle('hidden');
        });

        document.querySelectorAll('.emoji-select').forEach(emoji => {
            emoji.addEventListener('click', (e) => {
                chatMessageInput.value += e.target.textContent;
                emojiPicker.classList.add('hidden');
                chatMessageInput.focus();
            });
        });
        
        document.addEventListener('click', (e) => {
            if (!emojiPicker.contains(e.target) && e.target !== emojiButton) {
                emojiPicker.classList.add('hidden');
            }
        });


        // --- RENDERING FUNCTIONS ---

        function renderEventDetails(event) {
            if (!event) {
                eventDisplay.innerHTML = '<p class="text-gray-500 italic">No event set yet. Be the organizer and set one below!</p>';
                return;
            }
            
            // Format date string from datetime-local input
            const date = new Date(event.date);
            const formattedDate = date.toLocaleDateString('en-US', { 
                weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
            });

            eventDisplay.innerHTML = `
                <div class="space-y-2">
                    <p class="text-2xl font-extrabold text-gray-800">${event.name}</p>
                    <p class="text-lg font-semibold text-indigo-500">
                        <span class="inline-block bg-indigo-100 px-3 py-1 rounded-full text-sm font-medium">${event.type}</span>
                    </p>
                    <p class="text-base text-gray-700">
                        <strong class="font-bold">When:</strong> ${formattedDate}
                    </p>
                    <p class="text-xs text-gray-400 italic">Set by Organizer ID: ${event.organizerId.substring(0, 8)}...</p>
                </div>
            `;
            showEventFormBtn.textContent = 'Edit Event Details';
        }

        function renderAttendees(attendees) {
            attendeeList.innerHTML = '';
            if (attendees.length === 0) {
                attendeeList.innerHTML = '<p class="text-gray-400 italic text-center p-2">Waiting for registrations...</p>';
                return;
            }

            attendees.forEach(attendee => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-3 hover:bg-gray-50 transition";
                
                div.innerHTML = `
                    <p class="font-medium text-gray-800 truncate">${attendee.name} 
                        ${attendee.userId === userId ? '<span class="text-xs text-indigo-500">(You)</span>' : ''}
                    </p>
                    <p class="text-sm text-gray-600 font-light ml-2">${attendee.item}</p>
                `;
                attendeeList.appendChild(div);
            });
        }

        function renderMessages(messages) {
            // Prevent auto-scrolling on initial load
            const shouldScroll = chatDisplay.scrollTop === 0;

            chatDisplay.innerHTML = ''; // Clear existing messages

            messages.forEach(msg => {
                const isMine = msg.senderId === userId;
                const div = document.createElement('div');
                
                div.className = `message-bubble ${isMine ? 'message-mine ml-auto' : 'message-other mr-auto'}`;
                
                const time = msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '';
                
                div.innerHTML = `
                    <p class="text-xs font-semibold ${isMine ? 'text-indigo-200' : 'text-gray-600'}">${msg.senderName}</p>
                    <p class="text-base">${msg.text}</p>
                    <p class="text-xs text-right ${isMine ? 'text-indigo-300' : 'text-gray-400'}">${time}</p>
                `;
                
                // Append in reverse order to maintain visual stacking (newest on bottom)
                chatDisplay.prepend(div); 
            });
            
            // Only scroll to bottom if it was already at the bottom before refresh or on first load
            if (shouldScroll) {
                chatDisplay.scrollTop = chatDisplay.scrollHeight;
            }
        }

        // Start the application
        window.onload = initializeAuth;

    </script>
</body>
</html>
